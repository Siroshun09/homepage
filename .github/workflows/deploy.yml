name: Deploy

on:
  workflow_dispatch:
    inputs:
      preview:
        description: Deploy to preview even when running from main
        type: boolean
        default: false
        required: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm and Node.js
        uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3.1.1
        with:
          cache: true
          require-lockfile: true

      - name: Build site
        run: pnpm run generate

      - name: Upload artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: homepage-build-${{ github.run_number }}
          path: ./dist
          overwrite: true

  deploy-production:
    if: github.ref == 'refs/heads/main' && !inputs.preview
    needs: build
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Deploy to production
        uses: ./.github/actions/deploy-site
        with:
          artifact-name: homepage-build-${{ github.run_number }}
          production: "true"
          github-pages-token: ${{ secrets.GH_PAGES_DEPLOY_TOKEN }}
          cloudflare-api-token: ${{ secrets.CLOUDFLARE_PRODUCTION_API_TOKEN }}
          cloudflare-account-id: ${{ vars.CLOUDFLARE_PRODUCTION_ACCOUNT_ID }}
          cloudflare-project-name: ${{ vars.CLOUDFLARE_PRODUCTION_PROJECT_NAME }}
          cloudflare-branch: main

  deploy-preview:
    if: github.ref != 'refs/heads/main' || inputs.preview
    needs: build
    runs-on: ubuntu-latest
    environment: preview
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Deploy to preview
        uses: ./.github/actions/deploy-site
        with:
          artifact-name: homepage-build-${{ github.run_number }}
          production: "false"
          cloudflare-api-token: ${{ secrets.CLOUDFLARE_PREVIEW_API_TOKEN }}
          cloudflare-account-id: ${{ vars.CLOUDFLARE_PREVIEW_ACCOUNT_ID }}
          cloudflare-project-name: ${{ vars.CLOUDFLARE_PREVIEW_PROJECT_NAME }}
          # Never use the project's production branch, even for preview runs from main.
          cloudflare-branch: preview/${{ github.ref_name }}
